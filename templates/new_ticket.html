
{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4 shadow-sm">
            <h2 class="fw-bold">Post a Problem</h2>
            <p class="text-muted mb-4">Describe your issue and set a budget to attract the best experts.</p>
            <form method="POST">
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Issue Title</label>
                        <input type="text" name="title" class="form-control" placeholder="Briefly describe the problem" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select">
                            <option value="Gaming">Gaming/Hardware</option>
                            <option value="Software">Software/OS</option>
                            <option value="Network">Network/Wifi</option>
                            <option value="Enterprise">Business/Enterprise</option>
                            <option value="General">General</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Detailed Description</label>
                    <textarea name="description" class="form-control" rows="6" placeholder="What is happening? Any error codes?" required></textarea>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Budget ($)</label>
                        <input type="number" name="budget" class="form-control" value="20" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Priority</label>
                        <select name="priority" class="form-select">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                            <option value="Urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Due Date</label>
                        <input type="date" name="due_date" class="form-control">
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">Post to Marketplace</button>
                    <a href="/" class="btn btn-outline-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
