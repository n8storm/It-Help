
<!DOCTYPE html>
<html>
<head>
    <title>Login - Nexus IT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #2c3e50; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 400px; border-radius: 15px; padding: 2rem; }
    </style>
</head>
<body>
    <div class="card login-card shadow-lg">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Nexus IT Support</h2>
            <p class="text-muted">Sign in to manage your requests</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
        </form>
        <div class="mt-3 small text-center text-muted">
            Demo: admin / admin123 | employee / user123
        </div>
    </div>
</body>
</html>
