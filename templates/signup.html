
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Sovereign IT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px; padding: 3rem; width: 450px; color: white; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }
        .form-control { 
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white; border-radius: 12px; padding: 0.8rem;
        }
        .form-control:focus { 
            background: rgba(255, 255, 255, 0.12); border-color: #6366f1; 
            color: white; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }
        .btn-nexus { 
            background: #6366f1; color: white; border: none; border-radius: 12px; 
            padding: 0.8rem; font-weight: 600; transition: 0.3s;
        }
        .btn-nexus:hover { background: #4f46e5; transform: translateY(-2px); }
        .auth-link { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        .auth-link:hover { color: white; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="glass-card text-center">
        <div class="mb-4">
            <div class="bg-primary d-inline-block p-3 rounded-circle mb-3"><i class="bi bi-person-plus-fill text-white fs-3"></i></div>
            <h2 class="fw-bold">Join Sovereign IT</h2>
            <p class="text-white-50">Join the future of IT management</p>
        </div>
        <form method="POST">
            <div class="mb-3 text-start">
                <label class="form-label text-white-50 small">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label text-white-50 small">Email Address</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-white-50 small">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-nexus w-100 mb-3">Create My Account</button>
        </form>
        <div class="text-center mt-4">
            <a href="/login" class="auth-link">Already have an account? Sign In <i class="bi bi-arrow-right"></i></a>
        </div>
    </div>
</body>
</html>
